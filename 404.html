<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable — Reborn Assistant</title>
    <meta name="description" content="Cette page n'existe pas. Retournez sur la page d'accueil de Reborn Assistant ou consultez la documentation.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#080808">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/site.css?v=2">
    <style>
        /* ═══ 404 — page-specific only (layout & components: /assets/css/site.css §14 .error-page).
               Served for every unknown URL at any depth: every link and asset stays absolute. ═══ */
        /* The message keeps its pre-redesign place: centred in the screen below the sticky header */
        .error-page { min-height: calc(100vh - var(--header-h)); min-height: calc(100svh - var(--header-h)); align-content: center; }
        /* Both actions share one width, whether side by side or stacked on a phone */
        .error-page .actions .btn { min-width: 12rem; }
    </style>
</head>
<body>
    <!-- ═══ Header ═══ -->
    <header class="site-header">
        <div class="site-header__inner">
            <a class="brand" href="/" aria-label="Reborn Assistant">
                <span class="brand__sigil" aria-hidden="true">R</span>
                <span class="brand__word">Reborn</span>
            </a>
        </div>
    </header>

    <main class="wrap error-page">
        <div class="code">404</div>
        <h1>Page Introuvable</h1>
        <div class="divider ornament" aria-hidden="true"></div>
        <p>Cette page n'existe pas ou a été déplacée. Retournez à l'accueil ou explorez la documentation pour trouver ce que vous cherchez.</p>
        <div class="actions">
            <a href="/" class="primary btn btn-primary">Accueil</a>
            <a href="/docs/" class="secondary btn btn-secondary">Documentation</a>
        </div>
    </main>
</body>
</html>
